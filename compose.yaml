services:
  music-shelf:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SHELF_ORIGIN: ${SHELF_ORIGIN:?Set the exact public HTTPS origin}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set a private Resend API key}
      EMAIL_FROM: ${EMAIL_FROM:?Set a verified sender address}
    volumes:
      - shelf-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
volumes:
  shelf-data:
